<!doctype html><meta charset="utf-8">
<style>

<!-- ridge: cold dusk over a mountain pass -->

      <stop offset=".78" stop-color="#9aa6b0"/><stop offset="1" stop-color="#cfd3d4"/>

    <linearGradient id="r-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7d90"/><stop offset="1" stop-color="#8d98a4"/>
    </linearGradient>
    <linearGradient id="r-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4859"/><stop offset="1" stop-color="#28323f"/>
    </linearGradient>
    <linearGradient id="r-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d26"/><stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="r-sun" cx=".66" cy=".74" r=".42">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity=".85"/><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>

  </defs>
  <rect width="272" height="160" fill="url(#r-sky)"/>
  <rect width="272" height="160" fill="url(#r-sun)"/>
  <path d="M0 108 L38 84 L64 96 L96 70 L128 94 L160 76 L196 98 L232 80 L272 104 V160 H0Z" fill="url(#r-far)" opacity=".75"/>

  <path d="M0 146 L46 128 L88 142 L132 120 L176 140 L220 126 L272 142 V160 H0Z" fill="url(#r-near)"/>
  <g stroke="#e8eef5" stroke-opacity=".5" stroke-width="1" fill="none">
    <path d="M96 70 L104 78 L112 74"/><path d="M160 76 L168 84 L176 80"/>
  </g>
  <rect width="272" height="160" fill="#0a0e14" opacity=".12"/>
</svg>

<!-- shoe: three-quarter product render -->
<svg data-scene="shoe" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eceff3"/>
    </linearGradient>
    <linearGradient id="s-upper" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#5a6b82"/><stop offset=".45" stop-color="#33415a"/><stop offset="1" stop-color="#1a2232"/>
    </linearGradient>
    <linearGradient id="s-toe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8098"/><stop offset="1" stop-color="#3b4860"/>
    </linearGradient>
    <linearGradient id="s-sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#d8dee6"/><stop offset="1" stop-color="#aeb8c4"/>
    </linearGradient>
    <radialGradient id="s-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2b3b4a" stop-opacity=".42"/><stop offset="1" stop-color="#2b3b4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#s-bg)"/>
  <ellipse cx="152" cy="226" rx="104" ry="18" fill="#2b3b4a" opacity=".20"/>
  <!-- midsole -->
  <path d="M44 206 q-8 -16 10 -22 l38 -10 q26 -9 46 -24 l40 -28 q16 -11 32 -4 q18 8 22 28 q4 22 -10 38 q-18 20 -52 26 l-88 10 q-30 3 -38 -14Z" fill="url(#s-sole)"/>
  <path d="M44 206 q-8 -16 10 -22 l38 -10 l0 34 l-10 1 q-30 3 -38 -3Z" fill="#c3ccd7" opacity=".7"/>
  <!-- upper -->
  <path d="M74 176 q-4 -22 16 -30 l36 -14 q22 -9 38 -24 l26 -24 q14 -12 28 -4 q16 9 18 28 q2 20 -12 34 q-20 20 -54 28 l-70 14 q-22 4 -26 -8Z" fill="url(#s-upper)"/>
  <!-- toe cap -->
  <path d="M188 84 q14 -12 28 -4 q16 9 18 28 q1 12 -5 22 q-18 -20 -41 -46Z" fill="url(#s-toe)"/>
  <!-- lace panel -->
  <g stroke="#e8edf3" stroke-width="3.4" stroke-linecap="round" opacity=".92">
    <path d="M122 142 l24 -14"/><path d="M134 154 l24 -14"/><path d="M146 166 l24 -15"/><path d="M110 130 l22 -13"/>
  </g>
  <!-- accent flash -->
  <path d="M96 166 q34 -8 62 -26 q20 -13 34 -28" stroke="#a3e635" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- heel pull -->
  <path d="M70 152 q-10 2 -10 12 q0 8 10 8" stroke="#8e9bb0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- outsole lugs -->
  <g fill="#8c97a4" opacity=".85">
    <rect x="58" y="196" width="13" height="7" rx="3"/><rect x="80" y="193" width="13" height="7" rx="3"/>
    <rect x="102" y="190" width="13" height="7" rx="3"/><rect x="124" y="186" width="13" height="7" rx="3"/>
    <rect x="146" y="181" width="13" height="7" rx="3"/><rect x="168" y="175" width="13" height="7" rx="3"/>
  </g>
  <!-- specular -->
  <path d="M104 134 q40 -10 72 -34" stroke="#ffffff" stroke-opacity=".28" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
